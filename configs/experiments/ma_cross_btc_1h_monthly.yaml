schema_version: 2
name: ma_cross_monthly_btc
description: MVP — MA Cross stability by month on BTCUSDT 1h

data:
  exchange: binance
  market: futures
  symbols:
    - BTCUSDT
  # RUN-6: список, как и symbols. Прогон идёт по всем парам символ × таймфрейм.
  timeframes:
    - 1h
  start: "2021-01-01"
  end: "2026-10-01"

time_slices:
  type: month
  min_bars: 300

strategy:
  name: ma_cross

params_grid:
  fast_ma: [10, 20, 50]
  slow_ma: [100, 150, 200]

execution:
  initial_balance: 10000
  commission_rate: 0.0006
  slippage_pct: 0.0003
  leverage: 3
  position_size_type: percent_balance
  position_size_value: 20
  allow_short: true
  close_on_reverse_signal: true
  signal_lag: 1
  fill_on: next_open

# RUN-4 — честный out-of-sample. Окна в днях: календарный месяц в timedelta
# точно не выражается, поэтому единицу выбирает автор конфига, а не код.
walk_forward:
  train_days: 180      # ~6 месяцев обучения
  test_days: 30        # ~1 месяц теста, сразу после train
  step_days: 30
  select_by: sharpe    # метрика отбора на train
  anchored: false      # скользящее окно; true — expanding от начала

# Untouched holdout: всё от этой даты и позже в research не попадает и
# проверяется ровно один раз, в самом конце.
holdout:
  start: "2026-04-01"

metrics:
  primary: stability_score
  secondary:
    - total_return_pct
    - max_drawdown_pct
    - sharpe
    - profit_factor
    - win_rate
    - trades_count

output:
  save_trades: true
  save_equity_curve: true
  save_plots: false
