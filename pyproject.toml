[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "trading-research"
version = "0.0.1"
description = "Research platform for finding and backtesting optimal trading-strategy configurations across time slices and market regimes."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "polars>=1.0",
    "duckdb>=1.0",
    "pyarrow>=16.0",
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "typer>=0.12",
    "rich>=13.0",
    "matplotlib>=3.8",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff==0.15.20",
    "mypy>=1.10",
    "pre-commit>=3.7",
    "types-PyYAML>=6.0",
]
# Внешний движок для golden-теста (BT-8). Тяжёлая зависимость (pandas/bokeh/numpy),
# поэтому вынесена отдельно: тест пропускается, если она не установлена.
golden = [
    "backtesting>=0.6",
]

[project.scripts]
trading-research = "trading_research.cli.main:app"

[tool.hatch.build.targets.wheel]
packages = ["src/trading_research"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4"]

[tool.ruff.lint.per-file-ignores]
# Typer требует вызовов в дефолтах аргументов (Option/Argument) — B008 неизбежен.
"src/trading_research/cli/main.py" = ["B008"]

[tool.mypy]
python_version = "3.11"
strict = true
mypy_path = "src"
packages = ["trading_research"]

# numpy приходит транзитивно (pyarrow/polars, а также golden-extra). Его свежие
# stubs используют PEP 695 (`type X = ...`), который mypy отвергает при
# python_version=3.11. numpy мы не типизируем напрямую — пропускаем его импорты.
[[tool.mypy.overrides]]
module = ["numpy.*"]
follow_imports = "skip"
follow_imports_for_stubs = true

# matplotlib не поставляет type stubs — пропускаем его импорты (AN-4, plots).
[[tool.mypy.overrides]]
module = ["matplotlib.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["src"]

[tool.coverage.run]
branch = true
source = ["trading_research"]

[tool.coverage.report]
show_missing = true
